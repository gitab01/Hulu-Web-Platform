# Render blueprint for the Streamline API service (free tier).
# New -> Blueprint -> select gitab01/Hulu-Web-Platform. Only MONGODB_URI needs a value;
# everything else has a working default you can adjust later in the dashboard.
# NOTE: Render free tier does NOT support Cron Jobs, so the recommender runs in-process
# (see RUN_RECOMMENDER_IN_PROCESS) instead of a scheduled cron service.
services:
  - type: web
    name: hulu-web-platform-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # The ONLY value you must set here: your MongoDB Atlas connection string.
      - key: MONGODB_URI
        sync: false
      # Auto-generated secrets — leave as-is.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PLAYBACK_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      # Set these to your Vercel client URL after Part 3 (they default to localhost so the
      # API deploys and /health works immediately).
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: FRONTEND_URL
        value: http://localhost:5173
      # API_PUBLIC_URL is intentionally omitted: the app derives the playback-URL host
      # from the incoming request (Render's own domain), so it needs no manual value.
      # Blank Stripe key => mock billing, fully usable. Add test keys to switch to real Stripe.
      - key: STRIPE_SECRET_KEY
        value: ""
      # In-process recommender replaces the (paid-only) nightly cron: recomputes every 6h.
      - key: RUN_RECOMMENDER_IN_PROCESS
        value: "true"
      - key: RECOMMENDER_INTERVAL_MINUTES
        value: "360"
